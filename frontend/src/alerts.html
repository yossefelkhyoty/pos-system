<!-- alerts.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>التنبيهات - المنتجات قليلة المخزون</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div id="connection-status" class="connection-status"></div>

  <header>
    <h1><span class="mohamed"> التنبيهات</span></h1>
    <nav>
      <button id="nav-home" onclick="loadPage('index.html')">الرئيسية</button>
      <button id="nav-products" onclick="loadPage('products.html')">المنتجات</button>
      <button id="nav-customers" onclick="loadPage('customers.html')">العملاء</button>
      <button id="nav-dashboard" onclick="loadPage('dashboard.html')">لوحة التحكم</button>
      <button id="nav-alerts" onclick="loadPage('alerts.html')" class="active" style="position: relative;">
        🔔 التنبيهات
        <span id="notificationBadge" style="position: absolute; top: -5px; right: -5px; 
                 background: red; color: white; 
                 border-radius: 50%; padding: 2px 6px; 
                 font-size: 12px; display: none;">
        </span>
      </button>
    </nav>
  </header>

  <h2>المنتجات التي وصلت للحد الأدنى من المخزون</h2>

  <table>
    <thead>
      <tr>
        <th>السيريال</th>
        <th>الاسم</th>
        <th>الكمية الحالية</th>
        <th>الحد الأدنى</th>
        <th>الإجراء</th>
      </tr>
    </thead>
    <tbody id="alertsTable"></tbody>
  </table>




  <!-- نافذة التعديل (Modal) -->
  <div id="editAlertModal" class="modal hidden">
    <div class="modal-content">
      <h2>تعديل المنتج</h2>
      <form id="editAlertProductForm">
        <input type="hidden" id="editAlertProductId">

        <label for="editAlertSerialNumber">السيريال:</label>
        <input type="text" id="editAlertSerialNumber" required>

        <label for="editAlertProductName">اسم المنتج:</label>
        <input type="text" id="editAlertProductName" required>

        <label for="editAlertPrice">سعر البيع:</label>
        <input type="number" step="0.01" id="editAlertPrice" required>

        <label for="editAlertWholesalePrice">سعر العملاء:</label>
        <input type="number" step="0.01" id="editAlertWholesalePrice" required>

        <label for="editAlertPurchasePrice">سعر الجملة:</label>
        <input type="number" step="0.01" id="editAlertPurchasePrice" required>

        <label for="editAlertQuantity">الكمية:</label>
        <input type="number" id="editAlertQuantity" required>

        <label for="editAlertMinQuantity">الحد الأدنى:</label>
        <input type="number" id="editAlertMinQuantity" required>

        <label for="editAlertCategory">الفئة:</label>
        <input type="text" id="editAlertCategory">

        <div class="modal-actions">
          <button type="submit">💾 حفظ</button>
          <button type="button" onclick="closeAlertEditModal()">❌ إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script src="auth-check.js"></script>
  <script src="custom-dialog.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
