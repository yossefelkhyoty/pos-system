<!-- products.html -->

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>إدارة المنتجات -علي الجداوي</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

  <div id="globalNotification" class="alert hidden"></div>
  <div id="connection-status" class="connection-status"></div>

  <header>
    <h1><span class="mohamed">المنتجات</span></h1>

    <div id="lowStockAlert" class="alert hidden">
      ⚠️ هناك منتجات وصلت للحد الأدنى من المخزون
    </div>
    <nav>
      <button id="nav-home" onclick="loadPage('index.html')">الرئيسية</button>
      <button id="nav-products" onclick="loadPage('products.html')" class="active">المنتجات</button>
      <button id="nav-customers" onclick="loadPage('customers.html')">العملاء</button>
      <button id="nav-dashboard" onclick="loadPage('dashboard.html')">لوحة التحكم</button>
      <button id="nav-alerts" onclick="loadPage('alerts.html')" style="position: relative;">
        🔔 التنبيهات
        <span id="notificationBadge" style="position: absolute; top: -5px; right: -5px; 
                 background: red; color: white; 
                 border-radius: 50%; padding: 2px 6px; 
                 font-size: 12px; display: none;">
        </span>
      </button>
    </nav>
  </header>

  <div class="container">
    <!-- نموذج إضافة منتج -->
    <div class="card">
      <h2>إضافة منتج جديد</h2>
      <form id="productForm">
        <div class="form-row">
          <input type="text" id="serialNumber" placeholder="السيريال نمبر">
          <input type="text" id="productName" placeholder="اسم المنتج" required>
        </div>
        <div class="form-row">
          <input type="number" step="0.01" id="price" placeholder="سعر البيع" required>
          <input type="number" step="0.01" id="wholesalePrice" placeholder="سعر العملاء" required>
          <input type="number" step="0.01" id="purchasePrice" placeholder="سعر الجملة" required>

        </div>
        <div class="form-row">
          <input type="number" id="quantity" placeholder="الكمية" required>
          <input type="number" id="minQuantity" placeholder="الحد الأدنى" required>
          <!-- في قسم إضافة المنتج -->
          <input type="text" id="category" placeholder="الفئة" list="categorySuggestions">
        </div>
        <datalist id="categorySuggestions">
          <!-- سيتم ملء هذا من JavaScript -->
        </datalist>
        <button type="submit">إضافة المنتج</button>
      </form>
    </div>



    <!-- البحث والتصفية -->
    <div class="card">
      <h2>البحث والتصفية</h2>
      <div class="form-row">
        <input type="text" id="searchProducts" placeholder="بحث بالاسم أو السيريال" oninput="searchProducts()">
        <select id="categoryFilter" onchange="filterProducts()">
          <option value="">جميع الفئات</option>
          <!-- سيتم ملء هذا من JavaScript -->
        </select>
      </div>
    </div>

    <!-- جدول المنتجات -->
    <div class="card">
      <h2>قائمة المنتجات</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>السيريال</th>
              <th>الاسم</th>
              <th> السعر البيع</th>
              <th>سعر العملاء</th>
              <th>سعر الجملة</th> <!-- ✅ العمود الجديد -->
              <th>الكمية</th>
              <th>الفئة</th>

              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="productsTable">
            <!-- سيتم ملء هذا من JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- نافذة التعديل (Modal) -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <h2>تعديل المنتج</h2>
      <form id="editProductForm">
        <input type="hidden" id="editProductId">

        <label for="editSerialNumber">السيريال:</label>
        <input type="text" id="editSerialNumber">

        <label for="editProductName">اسم المنتج:</label>
        <input type="text" id="editProductName" required>

        <label for="editPrice">سعر البيع:</label>
        <input type="number" step="0.01" id="editPrice" required>

        <label for="editWholesalePrice">سعر العملاء</label>
        <input type="number" step="0.01" id="editWholesalePrice" required>

        <label for="editPurchasePrice">سعر الجملة:</label>
        <input type="number" step="0.01" id="editPurchasePrice" required>


        <label for="editQuantity">الكمية:</label>
        <input type="number" id="editQuantity" required>

        <label for="editMinQuantity">الحد الأدنى:</label>
        <input type="number" id="editMinQuantity" required>

        <label for="editCategory">الفئة:</label>
        <input type="text" id="editCategory">

        <div class="modal-actions">
          <button type="submit">💾 حفظ</button>
          <button type="button" onclick="closeEditModal()">❌ إلغاء</button>
        </div>
      </form>
    </div>
  </div>




  <!-- نافذة خيارات إضافية (More Options Modal) -->
  <div id="moreOptionsModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="moreOptionsTitle">خيارات إضافية</h2>
      <div id="moreOptionsBody" class="modal-actions-list">
        <!-- الأزرار ستضاف هنا من JS -->
      </div>
      <div class="modal-actions">
        <button type="button" onclick="closeMoreOptionsModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <script src="qrcode-helper.js"></script>
  <script src="auth-check.js"></script>
  <script src="custom-dialog.js"></script>
  <script src="products.js"></script>
</body>

</html>
